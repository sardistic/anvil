<!doctype html>

    box-shadow:inset 0 0 60px rgba(0,0,0,.6)}

<body>
<div id="wrap"><div id="screen"><canvas id="c"></canvas><canvas id="fx"></canvas><div id="crt"></div></div></div>
<div id="help">&larr;&rarr; / A D MOVE &nbsp; SPACE JUMP &nbsp; SHIFT / X DASH &nbsp; M MUTE &nbsp; R RESTART</div>
<script data-cfasync="false">
// ================================================================
//  ANVIL - a short monochrome walk toward the upload.
//  World units: 400x225. Rendered at 2x (800x450) in grayscale,
//  then a static 4x4 Bayer dither makes it 1-bit ink.
// ================================================================
const W = 400, H = 225, GROUND = 190;
let S = 3, BW, BH, out;
const disp = document.getElementById('c');
const dctx = disp.getContext('2d');
// colour glow overlay: the only colour in the game, reserved for rare powers
const fx = document.getElementById('fx'); fx.width = 800; fx.height = 450; const fxc = fx.getContext('2d');
const buf = document.createElement('canvas');
const ctx = buf.getContext('2d', { willReadFrequently: true });
function setScale(s) { S = s; BW = W * S; BH = H * S; disp.width = buf.width = BW; disp.height = buf.height = BH; out = dctx.createImageData(BW, BH); }
setScale(S);
// 8x8 Bayer: 64 tonal steps
const BAYER = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];
const gcache = {};
const G = v => { v = Math.max(0, Math.min(255, v | 0)); return gcache[v] || (gcache[v] = 'rgb(' + v + ',' + v + ',' + v + ')'); };

// ---------- seeded rng ----------
let seed = 1337;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const R = (a, b) => a + rnd() * (b - a);

// ---------- input ----------
const keys = {};
let anyKey = false, jumpBuf = 0, coyote = 0, dashBuf = 0;
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  const k = e.key.toLowerCase(); keys[k] = true; anyKey = true;
  if ([' ','arrowup','w'].includes(k) && !e.repeat) jumpBuf = 8;
  if (['shift','x','k'].includes(k) && !e.repeat) dashBuf = 8;
  if (k === 'm') toggleMute();
  if (state === 'ending' && endPhase === 'name') {
    if (e.key === 'Enter') submitScore();
    else if (e.key === 'Backspace') nameBuf = nameBuf.slice(0, -1);
    else if (e.key.length === 1 && /[a-z0-9 _.\-]/i.test(e.key) && nameBuf.length < 12) nameBuf += e.key.toUpperCase();
    e.preventDefault(); return;
  }
  if (k === 'r' && !(state === 'ending' && endPhase === 'sending')) reset(true);
  startAudio();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
addEventListener('pointerdown', () => { anyKey = true; startAudio(); });
const left  = () => keys['arrowleft'] || keys['a'];
const right = () => keys['arrowright'] || keys['d'];
const jumpK = () => keys[' '] || keys['arrowup'] || keys['w'];

// ================================================================
//  AUDIO - a synthesized score that follows the acts and the body.
//  Layers: sub drone (always) -> filter opens with your speed
//          pad (act II+)      -> pitch lifts while you are airborne
//          hats (act II+), arp (act III), unease tone (1 integrity)
//  Tempo climbs 96 -> 104 -> 112 bpm across the acts.
// ================================================================
let AC = null, master = null, muted = false, audioStarted = false;
const A = {}; // live audio nodes
function startAudio() {
  if (audioStarted) return; audioStarted = true;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
    // sub drone through a lowpass that breathes with movement
    A.lp = AC.createBiquadFilter(); A.lp.type = 'lowpass'; A.lp.frequency.value = 140; A.lp.Q.value = 2; A.lp.connect(master);
    [55, 55.6, 27.5].forEach((f, i) => {
      const o = AC.createOscillator(); o.type = i === 2 ? 'sine' : 'sawtooth'; o.frequency.value = f;
      const g = AC.createGain(); g.gain.value = i === 2 ? 0.35 : 0.12; o.connect(g); g.connect(A.lp); o.start();
    });
    // pad: a fifth, slightly detuned, faded in from act II
    A.padG = AC.createGain(); A.padG.gain.value = 0; A.padG.connect(master);
    A.padOsc = [110, 110.7, 165, 220.5].map(f => { const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f; const g = AC.createGain(); g.gain.value = 0.25; o.connect(g); g.connect(A.padG); o.start(); return o; });
    // unease: beats against the 55 Hz drone when integrity is 1
    A.uneaseG = AC.createGain(); A.uneaseG.gain.value = 0; A.uneaseG.connect(master);
    const u = AC.createOscillator(); u.type = 'sawtooth'; u.frequency.value = 58.5; u.connect(A.uneaseG); u.start();
    // noise buffer for hats, steps, wind
    const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    A.noise = nb;
    const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 0.4;
    A.windG = AC.createGain(); A.windG.gain.value = 0.03; ns.connect(bp); bp.connect(A.windG); A.windG.connect(master); ns.start();
  } catch (e) { AC = null; }
}
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; }
function noiseHit(t, freq, q, gain, dur) {
  const n = AC.createBufferSource(); n.buffer = A.noise; n.loop = true;
  const f = AC.createBiquadFilter(); f.type = freq > 2000 ? 'highpass' : 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t + dur + 0.05);
}
function kick(t) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.25);
  g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.4);
}
function anvilHit(t, pitch) {
  pitch = pitch || 1;
  [1, 1.5, 2.76, 4.1].forEach((m, i) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square';
    o.frequency.value = 180 * m * pitch;
    g.gain.setValueAtTime(0.12 / (i + 1), t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.6 - i * 0.1);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.7);
  });
}
const ARP = [0, 3, 7, 10, 12, 10, 7, 3];
function arp(t, step) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square';
  o.frequency.value = 220 * Math.pow(2, ARP[step % ARP.length] / 12);
  g.gain.setValueAtTime(0.035, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.15);
}
function sfx(kind) {
  if (!AC) return; const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(master);
  if (kind === 'frag')   { o.type = 'square'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.06); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.start(t); o.stop(t + 0.25); }
  if (kind === 'heal')   { o.type = 'square'; [660, 880, 1320].forEach((f, i) => o.frequency.setValueAtTime(f, t + i * 0.07)); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4); o.start(t); o.stop(t + 0.4); }
  if (kind === 'hit')    { o.type = 'sawtooth'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.4); g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5); o.start(t); o.stop(t + 0.5); }
  if (kind === 'jump')   { o.type = 'triangle'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(260, t + 0.1); g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15); o.start(t); o.stop(t + 0.2); }
  if (kind === 'dash')   { o.type = 'sawtooth'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.12); g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.start(t); o.stop(t + 0.2); noiseHit(t, 3000, 1, 0.15, 0.2); }
  if (kind === 'stomp')  { o.type = 'square'; o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.3); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35); o.start(t); o.stop(t + 0.4); }
  if (kind === 'step')   { noiseHit(t, 900, 1.5, 0.08, 0.05); }
  if (kind === 'upload') { o.type = 'sine'; o.frequency.setValueAtTime(60, t); o.frequency.exponentialRampToValueAtTime(2400, t + 4); g.gain.setValueAtTime(0.25, t); g.gain.linearRampToValueAtTime(0, t + 5); o.start(t); o.stop(t + 5); }
}
// per-frame score control: act, movement, height, health
function scoreUpdate() {
  if (!AC) return;
  const t = AC.currentTime, tc = 0.08;
  const act = state === 'play' ? actIndex() : 0;
  const playing = state === 'play';
  const speed = playing ? Math.abs(P.vx) : 0;
  const airborne = playing && !P.ground;
  const height = playing ? Math.max(0, GROUND - 26 - P.y) : 0;
  // drone filter opens with speed and act; slams open on a dash
  const cutoff = 120 + act * 90 + speed * 150 + (dashT > 0 ? 900 : 0);
  A.lp.frequency.setTargetAtTime(cutoff, t, tc);
  // pad swells by act, lifts in pitch while airborne
  A.padG.gain.setTargetAtTime(state === 'ending' ? 0.3 : act === 0 ? 0 : act === 1 ? 0.07 : 0.13, t, 0.4);
  A.padOsc.forEach((o, i) => o.detune.setTargetAtTime(airborne ? height * 3 : 0, t, tc));
  A.uneaseG.gain.setTargetAtTime(playing && integrity === 1 ? 0.12 : 0, t, 0.3);
  A.windG.gain.setTargetAtTime(0.03 + speed * 0.015 + (act === 1 ? 0.02 : 0), t, tc);
}
function beatInterval() { return [625, 577, 536][state === 'play' ? actIndex() : 0]; }

// ---------- world generation ----------
const LEVEL_END = 5200;
function makeBuildings(span, minW, maxW, minH, maxH, detail) {
  const arr = []; let x = -300;
  while (x < span) {
    const w = R(minW, maxW), h = R(minH, maxH);
    const b = { x, w, h, type: rnd() < 0.25 ? 'stack' : rnd() < 0.4 ? 'antenna' : rnd() < 0.5 ? 'tank' : 'flat', win: [], bands: rnd() < 0.5, setback: rnd() < 0.4 ? R(0.3, 0.7) : 0,
      escape: detail && w > 40 && rnd() < 0.35, neon: detail && rnd() < 0.3 ? { x: R(4, w - 10), h: R(18, 34), glyphs: Math.floor(R(3, 6)) } : null, vents: Math.floor(R(0, 3)), blink: rnd() < 0.5 };
    if (detail) { const cols = Math.floor(w / 8), rows = Math.floor(h / 10); for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (rnd() < 0.3) b.win.push([c * 8 + 3, r * 10 + 6, rnd() < 0.3 ? 3 : 2, rnd() < 0.5]); }
    arr.push(b); x += w + R(4, 18);
  }
  return arr;
}
const far  = makeBuildings(2200, 18, 40, 60, 150, false);
const mid  = makeBuildings(3400, 24, 60, 40, 120, true);
const near = makeBuildings(LEVEL_END + 600, 30, 90, 30, 90, true);
const stacks = [];
near.forEach(b => { if (b.type === 'stack') stacks.push({ x: b.x + b.w * 0.5, y: GROUND - b.h - 26 }); });
const smoke = [];
// wires sag between neighbouring near buildings
const wires = []; for (let i = 0; i < near.length - 1; i++) if (rnd() < 0.5) { const a = near[i], b = near[i + 1]; wires.push({ x1: a.x + a.w, y1: GROUND - a.h + R(4, 14), x2: b.x, y2: GROUND - b.h + R(4, 14), sag: R(4, 12) }); }
// foreground rail: posts and pipes that pass fast, for depth
const rails = []; for (let x = -200; x < LEVEL_END + 800; x += R(160, 360)) rails.push({ x, h: R(6, 11), pipe: rnd() < 0.7 });
const lamps = []; for (let x = 150; x < LEVEL_END; x += R(220, 320)) lamps.push({ x });
const grates = []; for (let x = 80; x < LEVEL_END; x += R(300, 600)) grates.push({ x });
const rain = []; for (let i = 0; i < 70; i++) rain.push({ x: rnd() * W, y: rnd() * H, l: R(6, 12), v: R(5, 8) });

// act II gaps are wide: cross them on the flying cars. Every gap has a 300px runway and a warning post.
const ground = [[-400, 2000], [2140, 2400], [2540, 2800], [2940, 3200], [3340, LEVEL_END + 800]];
// containers (solid, all jumpable: max 40 tall) and girders
const platforms = [
  { x: 500, y: 170, w: 40, h: 20 }, { x: 560, y: 150, w: 50, h: 40 },
  { x: 900, y: 165, w: 50, h: 25 }, { x: 950, y: 150, w: 40, h: 40 },
  { x: 1450, y: 165, w: 50, h: 25 },
  { x: 2200, y: 145, w: 60, h: 6, girder: true }, { x: 2620, y: 140, w: 60, h: 6, girder: true }, { x: 3020, y: 145, w: 70, h: 6, girder: true },
  { x: 3450, y: 170, w: 40, h: 20 }, { x: 3490, y: 150, w: 40, h: 40 }, { x: 3800, y: 160, w: 40, h: 30 },
  { x: 4150, y: 155, w: 40, h: 35 }, { x: 4700, y: 165, w: 50, h: 25 },
];
const movers = [ // flying cars that shuttle across the gaps
  { cx: 2070, amp: 72, y: 176, w: 44, h: 8, sp: 0.02, ph: 0 },
  { cx: 2470, amp: 72, y: 172, w: 44, h: 8, sp: 0.024, ph: 2 },
  { cx: 2870, amp: 72, y: 176, w: 44, h: 8, sp: 0.022, ph: 4 },
  { cx: 3270, amp: 72, y: 170, w: 44, h: 8, sp: 0.026, ph: 1 },
].map(m => Object.assign({ x: m.cx, px: m.cx }, m));
// breakable crates: dash into them. Some hold a core (variable reward).
const cratesInit = [420, 830, 1600, 2250, 2660, 3560, 4000, 4600].map((x, i) => ({ x, y: GROUND - 14, w: 14, h: 14, core: i % 3 === 1 }));
// steam geysers: stand on one when it blows to launch high
const geysers = [1200, 2300, 3700, 4500].map((x, i) => ({ x, ph: i * 60 }));
const GEYSER_PERIOD = 240, GEYSER_ON = 70;
const groundSolids = ground.map(g => ({ x: g[0], y: GROUND, w: g[1] - g[0], h: 60 }));
// fragments laid in arcs and columns so every jump, stomp and launch pays
const fragmentsInit = [];
function arc(x, y, n, step, rise) { for (let i = 0; i < n; i++) { const t = n > 1 ? i / (n - 1) : 0.5; fragmentsInit.push([x + i * step, y - Math.sin(t * Math.PI) * rise]); } }
function row(x, y, n, step) { for (let i = 0; i < n; i++) fragmentsInit.push([x + i * step, y]); }
function col(x, y, n, step) { for (let i = 0; i < n; i++) fragmentsInit.push([x, y - i * step]); }
row(300, 174, 3, 12);            // taster
arc(490, 160, 5, 14, 28);        // over the first container
row(566, 138, 3, 12);            // on the tall container
row(690, 98, 3, 12);             // above drone 700: stomp bounce reaches these
row(906, 152, 3, 12); row(955, 138, 2, 12);
col(1200, 150, 4, 26);           // geyser column
arc(1250, 150, 5, 12, 40);       // over drone 1250
row(1456, 152, 3, 12);
arc(1650, 160, 5, 12, 46);       // over drone 1650
arc(2030, 160, 5, 18, 22);       // gap 1, ride the car
row(2206, 132, 4, 12);           // girder
col(2300, 150, 4, 26);           // geyser
arc(2440, 160, 5, 18, 22); row(2626, 127, 4, 12); arc(2840, 160, 5, 18, 22); row(3026, 132, 5, 12); arc(3240, 160, 5, 18, 22);
row(3456, 156, 2, 12); row(3496, 138, 3, 12);
arc(3600, 160, 5, 12, 46);       // over drone 3600
col(3700, 150, 4, 26);           // geyser
row(3806, 148, 3, 12); row(4156, 142, 3, 12);
arc(4400, 160, 5, 12, 46);       // over drone 4400
col(4500, 150, 4, 26);           // geyser
row(4706, 152, 4, 12); arc(4800, 170, 6, 14, 30); // run-in to the door
const dronesInit = [700, 1250, 1650, 2250, 2660, 3060, 3600, 3950, 4400].map((x, i) => ({ x, y: 122 + (i % 3) * 8, ph: i * 1.7 }));
const cars = []; for (let i = 0; i < 14; i++) cars.push({ x: R(0, LEVEL_END), y: R(40, 140), v: R(2, 6) * (rnd() < 0.5 ? 1 : -1), z: rnd(), len: R(12, 26) });
const billboards = [
  { x: 380, y: 60, w: 130, h: 22, t: 'LIFE AFTER DEATH', z: 0.6 },
  { x: 1500, y: 50, w: 70, h: 22, t: 'ASCEND', z: 0.6 },
  { x: 2350, y: 40, w: 150, h: 22, t: 'LEAVE THE BODY', z: 0.6 },
  { x: 2950, y: 55, w: 150, h: 22, t: 'YOU WILL BE KEPT', z: 0.6 },
  { x: 4050, y: 30, w: 80, h: 30, t: 'ANVIL', z: 0.6, big: true },
];
const acts = [[0, 'I.  THE STREET'], [1700, 'II.  THE OVERPASS'], [3400, 'III.  THE ANVIL']];
// rare powers: each changes how you play for a while (autonomy), and each has its own colour
const POWERS = {
  phase:  { name: 'PHASE',     col: [70, 220, 255],  dur: 12 * 60, hint: 'the lights cannot see you' },
  magnet: { name: 'MAGNET',    col: [255, 190, 50],  dur: 15 * 60, hint: 'fragments come to you' },
  over:   { name: 'OVERCLOCK', col: [255, 70, 210],  dur: 10 * 60, hint: 'double jump . fast dash . score x2' },
  shield: { name: 'SHIELD',    col: [110, 255, 140], dur: 0,       hint: 'absorbs one hit' },
};
const POWER_KEYS = Object.keys(POWERS);
// fixed rare spots sit at the top of the geyser columns; more drop by chance from crates and stomps
const pickupsInit = [{ x: 1200, y: 40, type: 'phase' }, { x: 2300, y: 40, type: 'magnet' }, { x: 3700, y: 40, type: 'over' }, { x: 4500, y: 40, type: 'shield' }];
const DOOR_X = 4980;
function actIndex() { let a = 0; for (let i = 0; i < acts.length; i++) if (P.x >= acts[i][0]) a = i; return a; }

// ---------- state ----------
let state, P, cam, frames, fragments, drones, integrity, glitch, invuln, actTitle, actT, checkpoint, endT, deadT, collected, lastBeatTime, beatN, shake, notice, noticeT, dashT, dashCd, trail, bursts, stomps, lastStep;
let score, airChain, fragChain, fragChainT, pops, freeze, slowT, crates, lastSafe, nearMissCd, runFrames, solids;
let pickups, power, shield, airJumps, setbacks, actHits, glowT;
let endPhase, nameBuf, board, myId, myPos, boardMsg;
try { nameBuf = localStorage.getItem('anvil.name') || ''; } catch (e) { nameBuf = ''; }
function finalRank() { return score >= 2600 ? 'S' : score >= 1800 ? 'A' : score >= 1000 ? 'B' : 'C'; }
async function loadBoard() { try { const r = await fetch('api/scores'); if (!r.ok) throw 0; board = (await r.json()).scores; } catch (e) { board = null; } }
async function submitScore() {
  if (endPhase !== 'name') return; endPhase = 'sending'; sfx('heal');
  const name = nameBuf.trim() || 'ANON'; try { localStorage.setItem('anvil.name', name); } catch (e) {}
  try {
    const r = await fetch('api/scores', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, score, rank: finalRank(), secs: Math.round(runFrames / 60), fragments: collected, stomps }) });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(); board = d.scores; myId = d.id; myPos = d.position; boardMsg = null;
  } catch (e) { boardMsg = 'OFFLINE - SCORE NOT SAVED'; }
  endPhase = 'board';
}
function reset(full) {
  state = full ? 'title' : 'play';
  P = { x: (full ? 40 : checkpoint), y: GROUND - 26, vx: 0, vy: 0, w: 10, h: 26, ground: false, face: 1, walk: 0, onMover: null };
  if (full) { checkpoint = 40; collected = 0; stomps = 0; score = 0; runFrames = 0; fragments = fragmentsInit.map(f => ({ x: f[0], y: f[1], got: false })); drones = dronesInit.map(d => Object.assign({ dead: false, fall: 0 }, d)); crates = cratesInit.map(c => Object.assign({ alive: true }, c)); pickups = pickupsInit.map(q => Object.assign({ got: false }, q)); shield = false; setbacks = []; }

  cars.forEach(c => { if (c.z < 0.5) { const sx = c.x - cam * 0.3; ctx.fillStyle = G(110); ctx.fillRect(sx, c.y, c.len * 0.6, 1.5); } });

  smoke.forEach(s => { const sx = s.x - cam; ctx.fillStyle = G(150 + 90 * (1 - s.life)); ctx.beginPath(); ctx.arc(sx, s.y, s.r, 0, 7); ctx.fill(); ctx.strokeStyle = G(60); ctx.lineWidth = 0.4; ctx.stroke(); });

    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(lx + 3, GROUND - 42); ctx.lineTo(lx - 22, GROUND); ctx.lineTo(lx + 28, GROUND); ctx.fill();
    ctx.fillStyle = G(0); ctx.fillRect(lx - 1, GROUND - 46, 2, 46); ctx.fillRect(lx - 1, GROUND - 46, 8, 1.5); ctx.fillRect(lx + 4, GROUND - 45, 4, 3);
    ctx.fillStyle = G(255); ctx.fillRect(lx + 4.5, GROUND - 43, 3, 1);
  });

  // sidewalk strip: buildings end behind it, so only outlined boxes on the street are solid
  ground.forEach(g => { const sx = g[0] - cam, w = g[1] - g[0]; if (sx + w < 0 || sx > W) return; ctx.fillStyle = G(255); ctx.fillRect(sx, GROUND - 4, w, 4); ctx.fillStyle = G(0); ctx.fillRect(sx, GROUND - 4, w, 0.5); for (let x = Math.floor(sx / 10) * 10; x < sx + w; x += 10) if (x >= sx) ctx.fillRect(x, GROUND - 3, 0.5, 3); });

    for (let x = Math.floor(sx / 16) * 16; x < sx + w; x += 16) if (x >= sx && x + 8 <= sx + w) ctx.fillRect(x, GROUND + 6, 8, 1);
    line(sx, GROUND + 40, sx + w, GROUND + 40, 255);
    ctx.fillStyle = G(255); ctx.fillRect(sx, GROUND + 2, w, 0.4); // curb
  });
  grates.forEach(g => { const gx = g.x - cam; if (gx < -20 || gx > W + 20) return; ctx.fillStyle = G(255); for (let i = 0; i < 5; i++) ctx.fillRect(gx - 6 + i * 3, GROUND + 1, 1.5, 3); });
  ctx.fillStyle = G(30); ctx.fillRect(0, GROUND + 40, W, H - GROUND - 40);
  // gaps: a lit drop between street segments
  for (let i = 0; i < ground.length - 1; i++) {

  }

  });
  geysers.forEach(g => { const gx = g.x - cam; if (gx < -30 || gx > W + 30) return;
    const on = geyserActive(g), ph = ((frames + g.ph) % GEYSER_PERIOD) / GEYSER_PERIOD;
    ctx.fillStyle = G(0); ctx.fillRect(gx - 9, GROUND - 3, 18, 3); ctx.strokeStyle = G(255); ctx.lineWidth = 0.5; ctx.strokeRect(gx - 9, GROUND - 3, 18, 3);
    ctx.fillStyle = G(255); for (let i = 0; i < 4; i++) ctx.fillRect(gx - 7 + i * 4, GROUND - 2, 2, 1);
    if (on) { const h = 120; const cg = ctx.createLinearGradient(0, GROUND - h, 0, GROUND); cg.addColorStop(0, G(255)); cg.addColorStop(1, G(180));
      ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(gx - 5, GROUND - 3); for (let y = 0; y <= h; y += 10) ctx.lineTo(gx - 5 - Math.sin((y + frames * 6) * 0.1) * 3 - y * 0.05, GROUND - 3 - y); for (let y = h; y >= 0; y -= 10) ctx.lineTo(gx + 5 + Math.cos((y + frames * 6) * 0.1) * 3 + y * 0.05, GROUND - 3 - y); ctx.fill();
      ctx.strokeStyle = G(0); ctx.lineWidth = 0.4; ctx.stroke();
    } else if (ph > 0.75) { ctx.fillStyle = G(220); for (let i = 0; i < 3; i++) ctx.beginPath(), ctx.arc(gx - 4 + i * 4, GROUND - 6 - ((frames * 2 + i * 7) % 12), 1.5, 0, 7), ctx.fill(); } // charging puffs
  });
  // warning posts before each gap
  for (let i = 0; i < ground.length - 1; i++) { const wx = ground[i][1] - 40 - cam; if (wx < -20 || wx > W + 20) continue;
    ctx.fillStyle = G(0); ctx.fillRect(wx - 1, GROUND - 30, 2, 30); ctx.fillRect(wx - 7, GROUND - 40, 14, 12);

  }
  movers.forEach(m => { const sx = m.x - cam; if (sx + m.w < 0 || sx > W) return; drawCar(sx, m.y, m.w, m.h, m.x - m.px); });

  // act III facility
  const dx = DOOR_X - cam;
  if (dx > -400 && dx < W + 100) {

  pickups.forEach(q => { if (q.got) return; const sx = q.x - cam; if (sx < -12 || sx > W + 12) return;

    ctx.fillStyle = G(255); ctx.beginPath(); ctx.arc(sx, y, 6, 0, 7); ctx.fill(); ctx.strokeStyle = G(0); ctx.lineWidth = 0.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, y, 3.5 + Math.sin(frames * 0.15) * 0.8, 0, 7); ctx.stroke();
    ctx.save(); ctx.translate(sx, y); ctx.rotate(frames * 0.04); ctx.fillStyle = G(0); ctx.fillRect(-1.5, -1.5, 3, 3); ctx.restore(); });
  fragments.forEach(f => { if (f.got) return; const sx = f.x - cam; if (sx < -10 || sx > W + 10) return;
    ctx.save(); ctx.translate(sx, f.y + Math.sin(frames * 0.08 + f.x) * 2); ctx.rotate(frames * 0.03);
    ctx.fillStyle = G(255); ctx.fillRect(-3.5, -3.5, 7, 7); ctx.strokeStyle = G(0); ctx.lineWidth = 0.5; ctx.strokeRect(-3.5, -3.5, 7, 7); ctx.fillStyle = G(0); ctx.fillRect(-1, -1, 2, 2); ctx.restore(); });

  // drones + scan lights
  drones.forEach(d => { const sx = d.x - cam; if (sx < -120 || sx > W + 120) return;
    const dy = d.dead ? d.y + d.fall : d.y + Math.sin(d.ph * 2) * 4;
    if (!d.dead) {
      const ang = Math.PI / 2 + Math.sin(d.ph) * 0.7, L = 95;
      const ax = sx + Math.cos(ang - 0.22) * L, ay = dy + Math.sin(ang - 0.22) * L, bx = sx + Math.cos(ang + 0.22) * L, by = dy + Math.sin(ang + 0.22) * L;
      ctx.fillStyle = G(d.hit ? 245 : 200); ctx.beginPath(); ctx.moveTo(sx, dy); ctx.lineTo(ax, ay); ctx.lineTo(bx, by); ctx.fill();
      line(sx, dy, ax, ay, 255); line(sx, dy, bx, by, 255);
    }
    ctx.fillStyle = G(0); ctx.beginPath(); ctx.ellipse(sx, dy, 7, 5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = G(255); ctx.lineWidth = 0.5; ctx.stroke();
    ctx.fillRect(sx - 13, dy - 1, 26, 1.5); ctx.fillRect(sx - 14, dy - 4, 3, 6); ctx.fillRect(sx + 11, dy - 4, 3, 6); // boom + thrusters
    ctx.fillRect(sx - 0.3, dy - 10, 0.6, 5); // antenna
    ctx.beginPath(); ctx.arc(sx, dy + 1, 2.5, 0, 7); ctx.stroke(); // lens ring
    ctx.fillStyle = G(d.dead ? 90 : 255); ctx.fillRect(sx - 1, dy, 2, 2);
    if (!d.dead) { ctx.fillStyle = G(200); ctx.fillRect(sx - 13, dy + 3, 2, 1 + Math.sin(frames * 0.3) * 0.5); ctx.fillRect(sx + 11, dy + 3, 2, 1 + Math.cos(frames * 0.3) * 0.5); }
  });

  bursts.forEach(b => { ctx.fillStyle = G(b.shade); ctx.fillRect(b.x - cam - 1, b.y - 1, 2, 2); });
  // rain
  ctx.strokeStyle = G(170); ctx.lineWidth = 0.4; ctx.beginPath();

  if (state !== 'ending') {
    trail.forEach(t => drawPlayer(t.x + 5 - cam, t.y, 1, 255 - t.life * 120, t.walk, t.face, true));
    drawPlayer(P.x + 5 - cam, P.y, 1, invuln > 0 ? 110 : 0, P.walk, P.face, false);
  }

    ctx.fillStyle = G(0); ctx.font = 'bold ' + sz + 'px "Courier New",monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const w = ctx.measureText(q.t).width; ctx.fillRect(x - w / 2 - 2, q.y - 1, w + 4, sz + 2); text(q.t, x, q.y, sz, sh, 'center'); });
  // foreground rail layer, passing fast
  rails.forEach(r => { const rx = r.x - cam * 1.35; if (rx < -30 || rx > W + 30) return;
    ctx.fillStyle = G(0); ctx.fillRect(rx, GROUND + 6 - r.h, 3, r.h + 34);
    ctx.strokeStyle = G(255); ctx.lineWidth = 0.5; ctx.strokeRect(rx, GROUND + 6 - r.h, 3, r.h + 34);
    if (r.pipe) { ctx.fillStyle = G(0); ctx.fillRect(rx - 30, GROUND + 8 - r.h, 63, 2.5); ctx.strokeRect(rx - 30, GROUND + 8 - r.h, 63, 2.5); }
  });

  // HUD
  if (state === 'play' || state === 'dead') {
    ctx.fillStyle = G(0); ctx.fillRect(0, 0, W, 13);
    const iv = Math.max(0, integrity);
    for (let i = 0; i < 3; i++) { ctx.strokeStyle = G(255); ctx.lineWidth = 0.6; ctx.strokeRect(6 + i * 11, 3, 8, 7); if (i < iv) { ctx.fillStyle = G(255); ctx.fillRect(6 + i * 11, 3, 8, 7); } }
    text('DASH', 44, 1, 10, 255); ctx.strokeRect(74, 3, 8, 7); if (dashCd === 0) { ctx.fillStyle = G(255); ctx.fillRect(74, 3, 8, 7); }
    text('SCORE ' + String(score).padStart(6, '0') + (airChain > 1 ? '  x' + airChain : fragChain > 1 ? '  x' + fragChain : ''), W / 2, 1, 10, 255, 'center');

function drawEnding() {
  const t = endT;
  if (t < 50) { drawScene(); ctx.fillStyle = G(255); ctx.globalAlpha = t / 50; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; return; }
  ctx.fillStyle = G(250); ctx.fillRect(0, 0, W, H);
  const s = 3, cx = W / 2, cy = 60;
  drawPlayer(cx, cy, s, 0, 0, 1, true);
  const lineY = Math.max(0, (t - 90) * 0.5);
  if (lineY > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const img = ctx.getImageData(0, 0, BW, BH); const d = img.data;
    const y0 = (cy - 10) * S, y1 = Math.min(BH, y0 + lineY * S), x0 = (cx - 40) * S, x1 = (cx + 40) * S;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const i = (y * BW + x) * 4;
      if (d[i] < 128) {
        const keep = Math.random() < 0.25 + (y1 - y) / (lineY * S) * 0.6;
        if (!keep) { d[i] = d[i + 1] = d[i + 2] = 250; }
        else { const jx = (Math.random() * 10 - 5) | 0; const j = (y * BW + Math.max(0, Math.min(BW - 1, x + jx))) * 4; d[j] = d[j + 1] = d[j + 2] = 0; }
      }
    }
    ctx.putImageData(img, 0, 0);
    ctx.setTransform(S, 0, 0, S, 0, 0);
  }
  if (t > 90 && t < 300) { ctx.fillStyle = G(0); ctx.fillRect(0, cy - 10 + lineY, W, 0.5); }
  if (t > 200) text('UPLOAD ' + String(Math.min(100, ((t - 200) * 0.6) | 0)).padStart(3, '0') + '%', W / 2, 160, 10, 0, 'center');
  if (t > 380) text('she is not gone. she is kept.', W / 2, 178, 10, Math.max(0, 200 - (t - 380) * 2), 'center', false);
  if (t > 520) {
    text('A N V I L', W / 2, 36, 40, 0, 'center');
    ctx.fillStyle = G(250); ctx.fillRect(0, 82, W, 140);
    const secs = Math.round(runFrames / 60);
    text('SCORE ' + score + '     RANK ' + finalRank(), W / 2, 84, 14, 0, 'center');
    text('fragments ' + collected + '/' + fragmentsInit.length + '   lights silenced ' + stomps + '/' + drones.length + '   ' + Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'), W / 2, 104, 9, 0, 'center', false);
    if (endPhase === 'name' || endPhase === 'sending') {
      text('WHO WAS KEPT?', W / 2, 128, 11, 0, 'center');
      ctx.fillStyle = G(0); ctx.fillRect(W / 2 - 62, 144, 124, 18);
      const shown = nameBuf + ((endPhase === 'name' && (frames >> 4) & 1) ? '_' : ' ');
      text(shown, W / 2, 148, 12, 255, 'center');
      text(endPhase === 'sending' ? 'SENDING...' : 'type a name  -  ENTER to submit', W / 2, 168, 9, 0, 'center', false);
      if (board && board.length) text('top: ' + board[0].name + ' ' + board[0].score, W / 2, 200, 9, 0, 'center', false);
      if (board === null) text('leaderboard offline', W / 2, 200, 9, 0, 'center', false);
    } else if (endPhase === 'board') {
      text('THE KEPT', W / 2, 118, 11, 0, 'center');
      if (boardMsg) text(boardMsg, W / 2, 140, 9, 0, 'center', false);
      else if (board) {
        const rows = board.slice(0, 8); let mineShown = false;
        rows.forEach((b, i) => { const y = 132 + i * 8.5, mine = b.id === myId; if (mine) { mineShown = true; ctx.fillStyle = G(0); ctx.fillRect(W / 2 - 100, y - 0.5, 200, 8.5); }
          const sh = mine ? 255 : 0; text(String(i + 1).padStart(2, '0'), W / 2 - 96, y, 8, sh, 'left'); text(b.name, W / 2 - 78, y, 8, sh, 'left'); text(String(b.score), W / 2 + 96, y, 8, sh, 'right'); text(b.rank || '', W / 2 + 60, y, 8, sh, 'right'); });
        if (!mineShown && myPos) text('you: #' + myPos + '  ' + (nameBuf.trim() || 'ANON') + '  ' + score, W / 2, 132 + rows.length * 8.5 + 2, 8, 0, 'center');
      }
      text('R  TO RETURN', W / 2, 210, 10, 0, 'center');
    }
  }
}

// ---------- post-process: static 1-bit ordered dither + glitch bands ----------
let rowOff = new Int16Array(BH);
function post() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const src = ctx.getImageData(0, 0, BW, BH).data, o = out.data;
  rowOff.fill(0);
  const gl = glitch + (state === 'ending' && endT > 50 && endT < 300 ? 0.2 : 0);
  if (gl > 0.05) {
    const bands = 1 + ((gl * 4) | 0);
    for (let b = 0; b < bands; b++) {
      const y = (Math.random() * BH) | 0, h = 4 + ((Math.random() * 16 * gl) | 0), off = ((Math.random() - 0.5) * 50 * gl) | 0;
      for (let i = y; i < Math.min(BH, y + h); i++) rowOff[i] = off;
    }
  }
  const sh = shake > 0.3 ? ((Math.random() - 0.5) * shake * 2) | 0 : 0;
  for (let y = 0; y < BH; y++) {
    const off = rowOff[y] + sh, by = (y & 7) << 3, sy = y * BW;
    for (let x = 0; x < BW; x++) {
      let sx = x + off; sx = sx < 0 ? 0 : sx >= BW ? BW - 1 : sx;
      const v = src[(sy + sx) << 2];
      const bit = v > (BAYER[by | (x & 7)] + 0.5) * 4 ? 255 : 0;
      const i = (sy + x) << 2; o[i] = o[i + 1] = o[i + 2] = bit; o[i + 3] = 255;
    }
  }
  dctx.putImageData(out, 0, 0);
}

// ---------- colour glow overlay (drawn over the 1-bit frame) ----------
function radial(x, y, r, col, a) {
  const g = fxc.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(' + col + ',' + a + ')'); g.addColorStop(0.5, 'rgba(' + col + ',' + (a * 0.35) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
  fxc.fillStyle = g; fxc.fillRect(x - r, y - r, r * 2, r * 2);
}
function glow() {
  fxc.clearRect(0, 0, 800, 450);
  if (state === 'title' || state === 'ending') return;
  const k = 2; // overlay px per world unit
  pickups.forEach(q => { if (q.got) return; const sx = q.x - cam; if (sx < -30 || sx > W + 30) return; radial(sx * k, (q.y + Math.sin(frames * 0.06 + q.x) * 2.5) * k, 34 + Math.sin(frames * 0.1) * 4, POWERS[q.type].col, 0.5); });
  const px = (P.x + 5 - cam) * k, py = (P.y + 13) * k;
  if (power) { const q = POWERS[power.type], fade = power.t < 120 ? power.t / 120 : 1; radial(px, py, 80 + Math.sin(frames * 0.12) * 6, q.col, 0.34 * fade); }
  if (shield) { const c = POWERS.shield.col; fxc.strokeStyle = 'rgba(' + c + ',0.45)'; fxc.lineWidth = 3; fxc.beginPath(); fxc.arc(px, py, 40 + Math.sin(frames * 0.1) * 3, 0, 7); fxc.stroke(); radial(px, py, 50, c, 0.14); }
  if (glowT > 0) radial(px, py, 60 + (30 - glowT) * 6, [255, 255, 255], glowT / 30 * 0.5);
}

// ---------- loop (fixed 60Hz) ----------
let last = performance.now(), acc = 0, slow = 0, checked = 0;
function loop(now) {
  acc += Math.min(100, now - last) * (slowT > 0 ? 0.4 : 1); last = now;
  while (acc >= 16.667) { if (freeze > 0) freeze--; else update(); acc -= 16.667; }
  const t0 = performance.now();
  ctx.setTransform(S, 0, 0, S, 0, 0);
  if (state === 'ending') drawEnding(); else drawScene();
  post(); glow();
  // if 3x can't hold 60 fps on this machine, settle at 2x
  if (S === 3 && checked < 180) { checked++; if (performance.now() - t0 > 14) slow++; if (checked === 180 && slow > 60) { setScale(2); rowOff = new Int16Array(BH); } }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
